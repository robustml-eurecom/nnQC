[project]
name = "nnqc"
version = "0.1.0"
description = "Segmentation quality control via a 2D latent diffusion model that reconstructs the correct mask from a corrupted one."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "robustml-eurecom" },
]
keywords = [
    "medical-imaging",
    "segmentation",
    "quality-control",
    "diffusion-models",
    "latent-diffusion",
    "monai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    # core deep-learning stack
    "torch>=2.4",
    "torchvision>=0.19",
    # MONAI generative models (DDIMScheduler, AutoencoderKL, DiffusionModelUNet)
    "monai[all]>=1.4",
    "monai-generative>=0.2.3 ; python_version < '3.13'",
    # data + I/O
    "numpy>=1.26",
    "nibabel>=5.3",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "pillow>=10",
    "einops>=0.8",
    "tqdm>=4.66",
    # CLIP cross-attention (UniMedCLIP).
    # NOTE: nnqc/xa.py needs the UniMed-CLIP *fork* of open_clip, not the
    # upstream `open-clip-torch` package - it calls `open_clip.get_mean_std` and
    # passes `inmem=` / `text_encoder_name=` to `create_model_and_transforms`,
    # none of which exist upstream. Install it with:
    #   pip install git+https://github.com/mbzuai-oryx/UniMed-CLIP.git
    "open_clip_torch @ git+https://github.com/mbzuai-oryx/UniMed-CLIP.git",
    "timm>=1.0",
    "transformers>=4.40",
    # xa.py imports cv2 for the CLIP input preprocessing.
    "opencv-python-headless>=4.9",
    # MONAI's PerceptualLoss(network_type="squeeze") backend.
    "lpips>=0.1.4",
    # used by scripts/prepare_backbone.py to fetch the UniMed-CLIP backbone
    "huggingface_hub>=0.23",
    # logging / viz
    "tensorboard>=2.17",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8",
]
# Distance-based QC metrics (hd95, assd, ...) used via metric="hd95".
metrics = [
    "medpy>=0.4",
]

[project.scripts]
nnqc = "nnqc.cli:main"

[project.urls]
Repository = "https://github.com/robustml-eurecom/nnQC"
Issues = "https://github.com/robustml-eurecom/nnQC/issues"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

# Files under nnqc/ (including nnqc/presets/*.json) ship in the wheel by
# default, so `--task prostate` works after a plain `uv pip install nnqc`.
[tool.hatch.build.targets.wheel]
packages = ["nnqc"]

[tool.hatch.build.targets.sdist]
include = [
    "nnqc/",
    "configs/",
    "tutorials/",
    "README.md",
    "LICENSE",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.uv]
# nnqc depends on a CUDA torch build; let the user's environment / index
# provide the right wheel rather than pinning one here.
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# `select`, not `extend-select`: extend-select adds to ruff's *default* set, which
# grows between releases (0.16 added BLE/S/PIE/RUF to the default), so the same
# command silently linted more rules after a ruff upgrade. Pin the set instead.
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
